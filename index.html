<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
window.onload = function(){
var D = JSON.parse(document.getElementById('pms-data').textContent);
var fK = function(v){ return '₩' + (v||0).toLocaleString('ko-KR'); };
var fM = function(v){ return v >= 1e8 ? (v/1e8).toFixed(1)+'억' : v >= 1e6 ? Math.round(v/1e6)+'M' : v.toLocaleString(); };

// 월별
(function(){
  var t = document.getElementById('tm'), mm = {};
  D.monthly.forEach(function(r){ mm[r.m] = r; });
  var tC=0, tK=0;
  D.all_months.forEach(function(m){
    var r = mm[m] || {c:0, k:0};
    tC += r.c; tK += r.k;
    var ml = m.split('-')[1].replace(/^0/,'') + '월';
    t.innerHTML += '<tr><td>'+ml+'</td><td>'+r.c+'</td><td class="mn">'+fK(r.k)+'</td></tr>';
  });
  document.getElementById('tmf').innerHTML = '<tr class="tot"><td>합계</td><td>'+tC+'</td><td class="mn">'+fK(tK)+'</td></tr>';
  var labels = D.all_months.map(function(m){ return m.split('-')[1].replace(/^0/,'')+'월'; });
  var values = D.all_months.map(function(m){ return (mm[m]||{k:0}).k; });
  var colors = D.all_months.map(function(m){ return mm[m] ? '#1B6FD8' : '#E2E8F0'; });
  new Chart(document.getElementById('cm'), {
    type: 'bar',
    data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 4 }] },
    options: { responsive:true, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:function(c){return fK(c.raw)}}} }, scales:{ y:{ticks:{callback:function(v){return fM(v)}}} } }
  });
})();

// 부서별
(function(){
  var t = document.getElementById('td'), tC=0, tK=0;
  D.dept.forEach(function(r){
    tC += r.c; tK += r.k;
    t.innerHTML += '<tr><td>'+r.d+'</td><td>'+r.c+'</td><td class="mn">'+fK(r.k)+'</td></tr>';
  });
  document.getElementById('tdf').innerHTML = '<tr class="tot"><td>합계</td><td>'+tC+'</td><td class="mn">'+fK(tK)+'</td></tr>';
  var top = D.dept.slice(0,10);
  new Chart(document.getElementById('cd2'), {
    type: 'bar',
    data: { labels: top.map(function(r){return r.d}), datasets: [{ data: top.map(function(r){return r.k}), backgroundColor: '#10B981', borderRadius: 4 }] },
    options: { indexAxis:'y', responsive:true, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:function(c){return fK(c.raw)}}} }, scales:{ x:{ticks:{callback:function(v){return fM(v)}}} } }
  });
})();

// 항목분류별
(function(){
  var t = document.getElementById('ti'), tC=0, tK=0;
  D.item.forEach(function(r){
    tC += r.c; tK += r.k;
    var pct = D.total_krw > 0 ? (r.k/D.total_krw*100).toFixed(1)+'%' : '0%';
    t.innerHTML += '<tr><td>'+r.i+'</td><td>'+r.c+'</td><td class="mn">'+fK(r.k)+'</td><td>'+pct+'</td></tr>';
  });
  document.getElementById('tif').innerHTML = '<tr class="tot"><td>합계</td><td>'+tC+'</td><td class="mn">'+fK(tK)+'</td><td>100%</td></tr>';
  var cl = D.item.filter(function(r){ return r.i !== '미분류'; });
  new Chart(document.getElementById('ci'), {
    type: 'doughnut',
    data: { labels: cl.map(function(r){return r.i}), datasets: [{ data: cl.map(function(r){return r.k}), backgroundColor: cl.map(function(r){return r.color}), borderWidth: 1 }] },
    options: { responsive:true, plugins:{ legend:{position:'bottom', labels:{font:{size:11}}}, tooltip:{callbacks:{label:function(c){return c.label+': '+fK(c.raw)}}} } }
  });
})();

// 미결제 목록
(function(){
  var t = document.getElementById('tu');
  D.unpaid_list.forEach(function(r){
    t.innerHTML += '<tr><td>'+r.no+'</td><td>'+r.dt+'</td><td>'+r.dep+'</td><td>'+(r.vnd||'-')+'</td><td class="mn">'+fK(r.k)+'</td><td>'+r.itm+'</td></tr>';
  });
})();

};
</script>
